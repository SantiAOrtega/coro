# Generate the Xcode project with:  ./setup.sh   (or: xcodegen generate)
name: Coro

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: es

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  CoroKit:
    path: CoroKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Coro:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: CoroKit
      - target: CoroWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Coro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: "Coro usa tu ubicación en baja precisión solo para seguir mostrando la letra en CarPlay con el móvil bloqueado. No se guarda ni se envía."
        NSAppleMusicUsageDescription: "Coro lee qué canción suena en Apple Music para mostrar su letra."
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)

  CoroWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    dependencies:
      - package: CoroKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Coro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Coro:
    build:
      targets:
        Coro: all
    run:
      config: Debug
    test:
      config: Debug
